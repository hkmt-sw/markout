description = "Serif type, wide margins, restrained color: like a book or a paper"

[page]
margin = "30mm"

[fonts]
body    = "serif"
heading = "serif"
code    = "mono"

[text]
size              = 11.5
line-height       = 17
paragraph-spacing = 8
color             = "#222222"
muted             = "#555555"
faint             = "#888888"

[heading]
color = "#111111"

[heading.h1]
size = 26
line-height = 31
space-before = 20
space-after = 12

[heading.h2]
size = 19
line-height = 24
space-before = 18
space-after = 8

[heading.h3]
size = 15
line-height = 20
space-before = 14
space-after = 6

[heading.h4]
size = 13
line-height = 18
space-before = 12
space-after = 6

[heading.h5]
size = 12
line-height = 16

[heading.h6]
size = 11.5
line-height = 16

[link]
color = "#1F3A5F"

[code]
color           = "#5B2C2C"
block-size      = 9
block-line-height = 12.5
block-color     = "#222222"
background      = "#F7F6F2"
border          = "#DDDAD0"

[table]
border            = "#BDB9AD"
header-background = "#EFEDE6"
row-background    = "#FFFFFF"
stripe-background = "#FFFFFF"

[quote]
bar    = "#9A968A"
italic = true

[rule]
color = "#9A968A"
width = 0.75

[box]
background = "#F7F6F2"
border     = "#DDDAD0"

[footnote]
rule = "#9A968A"

[footer]
center = "{page}"
color  = "#555555"
