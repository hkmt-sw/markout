description = "Sans-serif and airy, with one vivid accent color"

[page]
margin = "25mm"

[fonts]
body    = "sans"
heading = "sans"
code    = "mono"

[text]
size              = 10.5
line-height       = 17
paragraph-spacing = 10
color             = "#1F2937"
muted             = "#6B7280"
faint             = "#9CA3AF"

[heading]
color = "#111827"

[heading.h1]
size = 30
line-height = 36
space-before = 8
space-after = 16
color = "#4F46E5"

[heading.h2]
size = 19
line-height = 25
space-before = 24
space-after = 10

[heading.h3]
size = 14
line-height = 20
space-before = 18
space-after = 8

[heading.h4]
size = 12
line-height = 17
space-before = 14
space-after = 6

[heading.h5]
size = 11
line-height = 16

[heading.h6]
size = 10.5
line-height = 16

[link]
color = "#4F46E5"

[code]
color           = "#BE185D"
block-size      = 9
block-line-height = 13
padding         = 10
block-color     = "#1F2937"
background      = "#F3F4F6"
border          = "#F3F4F6"

[list]
space-after = 8

[table]
cell-padding      = 6
line-height       = 14
border            = "#E5E7EB"
header-background = "#EEF2FF"
row-background    = "#FFFFFF"
stripe-background = "#FAFAFA"

[quote]
bar       = "#4F46E5"
bar-width = 2
italic    = false

[rule]
color = "#E5E7EB"

[box]
background = "#F9FAFB"
border     = "#E5E7EB"

[footnote]
rule = "#E5E7EB"

[footer]
right = "{page}"
color = "#9CA3AF"
