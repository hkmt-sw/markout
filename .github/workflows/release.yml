name: release

# Build cross-platform binaries and publish a GitHub release whenever a
# version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets
  id-token: write # needed to sign the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so `git describe` sees the tag

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Always the newest Go release, so binaries carry the latest
          # standard-library security fixes; go.mod states the minimum.
          go-version: stable
          check-latest: true

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        run: make release # cross-compiles all PLATFORMS + SHA256SUMS.txt into dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/markout_*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag such as v1.8.0-rc1 is a release candidate: published as a
          # pre-release, and not what "latest" points at, so the download
          # links and the update check keep offering the last real release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
