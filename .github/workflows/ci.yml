name: CI

# Build, vet and test on every push to master and on pull requests.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Always the newest Go release, so binaries carry the latest
          # standard-library security fixes; go.mod states the minimum.
          go-version: stable
          check-latest: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The branch protection rule requires a check named "test". This job gives
  # it one result for all platforms.
  test:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All platforms passed
        run: |
          if [ "${{ needs.platform.result }}" != "success" ]; then
            echo "The tests did not pass on every platform."; exit 1
          fi
